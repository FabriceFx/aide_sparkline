<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 4px;
        }

        .section-title {
            font-size: 0.65rem;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 4px;
            margin-bottom: 8px;
            margin-top: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .section-title:hover {
            color: #374151;
        }

        .section-title svg {
            transition: transform 0.2s;
            width: 10px;
            height: 10px;
        }

        .section-title.collapsed svg {
            transform: rotate(-90deg);
        }

        .section-content {
            transition: max-height 0.3s ease-out;
            overflow: hidden;
        }

        .section-content.collapsed {
            display: none;
        }

        .compact-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #374151;
            display: block;
            margin-bottom: 2px;
        }

        .input-style {
            width: 100%;
            border-radius: 0.375rem;
            border: 1px solid #d1d5db;
            font-size: 0.75rem;
            padding: 4px 6px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-style:focus {
            border-color: #0f9e59;
            ring: 1px #0f9e59;
        }

        .btn-sheets-green {
            background-color: #0f9e59;
            color: white;
            transition: background-color 0.2s;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .btn-sheets-green:hover {
            background-color: #0b7a44;
        }

        .color-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .color-picker-sm {
            height: 1.25rem;
            width: 1.25rem;
            flex-shrink: 0;
            cursor: pointer;
            border: 1px solid #e5e7eb;
        }

        #chartCanvas {
            background: transparent;
            width: 100%;
            height: 50px;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 h-full overflow-y-auto">

    <div class="p-3 space-y-4">
        <header class="text-center pb-2">
            <p class="text-[10px] text-gray-500 italic">Sélectionnez des cellules puis cliquez sur "Obtenir"</p>
        </header>

        <div class="bg-white p-2 rounded-md border shadow-sm space-y-2">
            <div>
                <label class="compact-label">Plage de données</label>
                <div class="flex gap-1">
                    <input type="text" id="rangeInput" placeholder="A1:E1" class="input-style flex-1">
                    <button onclick="fetchRange('rangeInput')"
                        class="btn-sheets-green px-2 py-1 rounded shadow-sm active:scale-95 transition">Obtenir</button>
                </div>
            </div>
            <div>
                <label class="compact-label">Cellule cible</label>
                <div class="flex gap-1">
                    <input type="text" id="targetInput" placeholder="F1" class="input-style flex-1">
                    <button onclick="fetchRange('targetInput')"
                        class="btn-sheets-green px-2 py-1 rounded shadow-sm active:scale-95 transition">Obtenir</button>
                </div>
            </div>
        </div>

        <div class="bg-white p-2 rounded-md border shadow-sm">
            <label class="compact-label">Type de graphique</label>
            <select id="chartType" onchange="updateOptionsUI()" class="input-style bg-white mb-2">
                <option value="line">Ligne (Tendance)</option>
                <option value="bar">Barre (Progression)</option>
                <option value="column">Colonne (Comparaison)</option>
                <option value="winloss">Gagné/Perdu (Booléen)</option>
            </select>

            <div class="section-title collapsed" onclick="toggleSection(this)">
                Paramètres globaux
                <svg viewBox="0 0 20 20" fill="currentColor">
                    <path
                        d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" />
                </svg>
            </div>
            <div class="section-content collapsed">
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <div>
                        <label class="compact-label !text-[10px]">Cellules vides</label>
                        <select id="empty" class="input-style !text-[10px]">
                            <option value="ignore">Ignorer</option>
                            <option value="zero">Zéro</option>
                        </select>
                    </div>
                    <div>
                        <label class="compact-label !text-[10px]">Non-numérique</label>
                        <select id="nan" class="input-style !text-[10px]">
                            <option value="ignore">Ignorer</option>
                            <option value="convert">Vers 0</option>
                        </select>
                    </div>
                </div>
                <label class="flex items-center text-[11px] font-medium cursor-pointer">
                    <input type="checkbox" id="rtl" class="mr-1"> De droite à gauche (RTL)
                </label>
            </div>

            <div id="lineOptions" class="space-y-2">
                <div class="section-title collapsed" onclick="toggleSection(this)">
                    Style de ligne
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <path
                            d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" />
                    </svg>
                </div>
                <div class="section-content collapsed">
                    <div class="grid grid-cols-2 gap-2">
                        <div class="flex flex-col">
                            <label class="compact-label !text-[10px]">Couleur</label>
                            <div class="color-row">
                                <input type="color" id="lineColor" value="#4285F4" class="color-picker-sm rounded">
                                <input type="text" id="lineColorText" value="#4285F4"
                                    class="input-style !p-1 !text-[9px] font-mono">
                            </div>
                        </div>
                        <div class="flex flex-col">
                            <label class="compact-label !text-[10px]">Épaisseur</label>
                            <input type="number" id="lineWidth" value="2" min="1" max="10" class="input-style">
                        </div>
                    </div>
                </div>

                <div class="section-title collapsed" onclick="toggleSection(this)">
                    Axes et Échelle
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <path
                            d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" />
                    </svg>
                </div>
                <div class="section-content collapsed">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="lineYmin" placeholder="Y Min" class="input-style !text-[10px]">
                        <input type="number" id="lineYmax" placeholder="Y Max" class="input-style !text-[10px]">
                        <input type="number" id="lineXmin" placeholder="X Min" class="input-style !text-[10px]">
                        <input type="number" id="lineXmax" placeholder="X Max" class="input-style !text-[10px]">
                    </div>
                </div>
            </div>

            <div id="barOptions" class="hidden space-y-2">
                <div class="section-title collapsed" onclick="toggleSection(this)">
                    Couleurs barres (Max 9)
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <path
                            d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" />
                    </svg>
                </div>
                <div class="section-content collapsed">
                    <div class="grid grid-cols-2 gap-x-2 gap-y-2" id="barColorGrid"></div>
                    <label class="compact-label !text-[10px] mt-2">Limite Max</label>
                    <input type="number" id="barMax" placeholder="Auto" class="input-style">
                </div>
            </div>

            <div id="columnOptions" class="hidden space-y-2">
                <div class="section-title collapsed" onclick="toggleSection(this)">
                    Style de colonne
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <path
                            d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" />
                    </svg>
                </div>
                <div class="section-content collapsed">
                    <div class="grid grid-cols-2 gap-1">
                        <div><label class="compact-label !text-[9px]">Base</label>
                            <div class="color-row"><input type="color" id="colColor" value="#4285F4"
                                    class="color-picker-sm rounded"><input type="text" id="colColorText" value="#4285F4"
                                    class="input-style !p-1 !text-[9px] font-mono"></div>
                        </div>
                        <div><label class="compact-label !text-[9px]">Négatif</label>
                            <div class="color-row"><input type="color" id="colNeg" value="#EA4335"
                                    class="color-picker-sm rounded"><input type="text" id="colNegText" value="#EA4335"
                                    class="input-style !p-1 !text-[9px] font-mono"></div>
                        </div>
                        <div><label class="compact-label !text-[9px]">Plus bas</label>
                            <div class="color-row"><input type="color" id="colLow" value="#FBBC04"
                                    class="color-picker-sm rounded"><input type="text" id="colLowText" value="#FBBC04"
                                    class="input-style !p-1 !text-[9px] font-mono"></div>
                        </div>
                        <div><label class="compact-label !text-[9px]">Plus haut</label>
                            <div class="color-row"><input type="color" id="colHigh" value="#34A853"
                                    class="color-picker-sm rounded"><input type="text" id="colHighText" value="#34A853"
                                    class="input-style !p-1 !text-[9px] font-mono"></div>
                        </div>
                        <div><label class="compact-label !text-[9px]">Premier</label>
                            <div class="color-row"><input type="color" id="colFirst" value="#9333ea"
                                    class="color-picker-sm rounded"><input type="text" id="colFirstText" value="#9333ea"
                                    class="input-style !p-1 !text-[9px] font-mono"></div>
                        </div>
                        <div><label class="compact-label !text-[9px]">Dernier</label>
                            <div class="color-row"><input type="color" id="colLast" value="#f43f5e"
                                    class="color-picker-sm rounded"><input type="text" id="colLastText" value="#f43f5e"
                                    class="input-style !p-1 !text-[9px] font-mono"></div>
                        </div>
                    </div>
                </div>

                <div class="section-title collapsed" onclick="toggleSection(this)">
                    Axes
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <path
                            d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" />
                    </svg>
                </div>
                <div class="section-content collapsed">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="colYmin" placeholder="Y Min" class="input-style !text-[10px]">
                        <input type="number" id="colYmax" placeholder="Y Max" class="input-style !text-[10px]">
                    </div>
                    <div class="flex items-center justify-between mt-2">
                        <label class="flex items-center text-[10px] font-medium cursor-pointer">
                            <input type="checkbox" id="hasAxis" class="mr-1"> Axe X
                        </label>
                        <div class="color-row">
                            <input type="color" id="axisColor" value="#000000" class="color-picker-sm rounded">
                            <input type="text" id="axisColorText" value="#000000"
                                class="input-style !p-1 !text-[9px] font-mono !w-16">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="py-2">
            <button onclick="resetDefaults()"
                class="w-full py-2 bg-red-50 text-red-700 border border-red-200 rounded text-sm font-medium hover:bg-red-100 active:scale-95 transition">Réinitialiser</button>
        </div>

        <div class="bg-white rounded-md shadow-sm border border-gray-200 overflow-hidden">
            <div class="bg-gray-50 px-2 py-1 flex justify-between items-center border-b border-gray-200">
                <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Aperçu visuel</span>
                <span id="previewDataSource" class="text-[9px] text-gray-400 italic">Données fictives</span>
            </div>
            <div class="p-2 flex items-center justify-center">
                <canvas id="chartCanvas"></canvas>
            </div>
            <div class="bg-gray-50 p-2 border-t border-gray-200">
                <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1">Formule</label>
                <code id="formulaPreview"
                    class="text-[10px] leading-tight break-all text-blue-700 font-mono block font-semibold">=SPARKLINE(...)</code>
            </div>
        </div>

        <div class="flex gap-2 pt-4 pb-4">
            <button onclick="google.script.host.close()"
                class="flex-1 py-2 border border-gray-300 rounded text-sm text-gray-600 font-medium hover:bg-gray-100 transition">Annuler</button>
            <button onclick="applyFormula()"
                class="flex-[2] py-2 btn-sheets-green rounded shadow-md active:scale-95 transition">Insérer</button>
        </div>
    </div>

    <script>
        /* La logique JavaScript reste la même mais avec les libellés traduits */
        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');

        let currentData = [];
        const mockData = [10, 50, 20, 90, 40, 70, 30];
        const mockBarData = [15, 25, 20, 15, 10, 5, 4, 3, 3];
        const mockColData = [20, -15, 45, 10, 60, -30, 25];
        const barColorDefaults = ['#4285F4', '#EA4335', '#FBBC04', '#34A853', '#9333ea', '#f43f5e', '#22d3ee', '#fb923c', '#94a3b8'];

        const barGrid = document.getElementById('barColorGrid');
        for (let i = 1; i <= 9; i++) {
            const container = document.createElement('div');
            container.innerHTML = `
        <label class="compact-label !text-[9px]">Couleur ${i}</label>
        <div class="color-row">
          <input type="color" id="barColor${i}" value="${barColorDefaults[i - 1]}" class="color-picker-sm rounded">
          <input type="text" id="barColorText${i}" value="" placeholder="${barColorDefaults[i - 1]}" class="input-style !p-1 !text-[9px] font-mono">
        </div>
      `;
            barGrid.appendChild(container);
        }

        /* ... Reste des fonctions setupColorSync, toggleSection, fetchRange ... */
        /* Mettre à jour 'Sheet Data' vers 'Données feuille' et 'Mock Data' vers 'Données fictives' dans fetchRange */

        function fetchRange(inputId) {
            google.script.run.withSuccessHandler(r => {
                document.getElementById(inputId).value = r;
                if (inputId === 'rangeInput') {
                    google.script.run.withSuccessHandler(data => {
                        currentData = data;
                        document.getElementById('previewDataSource').innerText = (data && data.length > 0) ? 'Données feuille' : 'Données fictives';
                        generatePreview();
                    }).getSelectedData();
                } else {
                    generatePreview();
                }
            }).getSelectedRange();
        }

        /* ... Le reste de la logique preview et formula reste identique au code source ... */
        /* */
    </script>
</body>

</html>
